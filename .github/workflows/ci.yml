name: ci
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  schedule:
    - cron: '23 3 * * *'   # 毎日: 最新の上流で再試験
  workflow_dispatch:
permissions: { contents: write }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[test]" pytest
      - run: python -m pytest -q
        env: { PYTHONPATH: "tests" }
  upstream-issue:
    # 毎日の定期実行(最新の Python / Flask / Django / FastAPI / Rust で再試験)が失敗したら、日付つきで issue を1件起こす
    if: failure() && github.event_name == 'schedule'
    needs: [test]
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          t="upstream: 最新版での定期試験が失敗 ($(date -u +%F))"
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$t in:title" --json number -q '.[0].number' | grep -q . ||             gh issue create -R "$GITHUB_REPOSITORY" --title "$t" --body "最新の上流(Python・Flask・Django・FastAPI・Starlette・Rust・Mojo)で定期試験が失敗しました。実行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - name: sha256 for every asset (used by the startup self-update)
        run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
  windows-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller libcst .
      - name: build 2FastAPI.exe (GUI + web + CLI in one)
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name 2FastAPI --add-data "src/tofastapi/2fastapi.ico;tofastapi" --collect-submodules libcst --paths src installer/launcher.py
      - name: installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=${{ matrix.arch }} /DExeDir=..\dist installer\2fastapi.iss
      - name: sha256 of the installer (used by the startup self-update)
        shell: pwsh
        run: Get-ChildItem installer/Output/2FastAPI-Setup-*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256" }
      - uses: softprops/action-gh-release@v2
        with: { files: "installer/Output/2FastAPI-Setup-*" }
  deb:
    # Linux: .deb (amd64 / arm64). Built and tested (dpkg -i -> run -> dpkg -r -> nothing left) on every push; attached to the release on tags.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller libcst .
      - name: build the 2fastapi binary
        run: python -m PyInstaller --noconfirm --onefile --name 2fastapi --collect-submodules libcst --collect-submodules tofastapi --hidden-import tofastapi._autoupdate --paths src installer/cli_entry.py
      - name: build the .deb
        run: |
          VER=$(python -c "import tofastapi;print(tofastapi.__version__)")
          bash installer/build-deb.sh dist/2fastapi "$VER" ${{ matrix.arch }} out
      - name: test (dpkg -i, run, dpkg -r, nothing left behind)
        run: bash installer/test-deb.sh out/*.deb
      - name: sha256 (used by the release page)
        run: cd out && for f in *.deb; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: "out/*" }
  pkg:
    # macOS: .pkg for the current user (x64 / arm64), no admin rights. Tested with pkgutil --expand and installer -pkg.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-latest, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller libcst .
      - name: build the 2fastapi binary
        run: python -m PyInstaller --noconfirm --onefile --name 2fastapi --collect-submodules libcst --collect-submodules tofastapi --hidden-import tofastapi._autoupdate --paths src installer/cli_entry.py
      - name: build the .pkg
        run: |
          VER=$(python -c "import tofastapi;print(tofastapi.__version__)")
          bash installer/build-pkg.sh dist/2fastapi "$VER" ${{ matrix.arch }} out
      - name: test (expand, installer -pkg, run, uninstall)
        run: bash installer/test-pkg.sh out/*.pkg
      - name: sha256 (used by the release page)
        run: cd out && for f in *.pkg; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: "out/*" }
