name: ci
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[test]" pytest
      - run: python -m pytest -q
        env: { PYTHONPATH: "tests" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - name: sha256 for every asset (used by the startup self-update)
        run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
  windows-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller libcst .
      - name: build 2FastAPI.exe (GUI + web + CLI in one)
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name 2FastAPI --add-data "src/tofastapi/2fastapi.ico;tofastapi" --collect-submodules libcst --paths src installer/launcher.py
      - name: installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=${{ matrix.arch }} /DExeDir=..\dist installer\2fastapi.iss
      - name: sha256 of the installer (used by the startup self-update)
        shell: pwsh
        run: Get-ChildItem installer/Output/2FastAPI-Setup-*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256" }
      - uses: softprops/action-gh-release@v2
        with: { files: "installer/Output/2FastAPI-Setup-*" }
